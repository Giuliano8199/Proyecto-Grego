<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Giuli RPG</title>
  <meta name="description" content="Tu vida real convertida en un RPG de rugby: misiones, aura, monstruos y un barrio para explorar.">
  <meta name="theme-color" content="#14182b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Giuli RPG">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="screen"></main>
    <section id="worldwrap" hidden>
      <canvas id="wcanvas"></canvas>
      <div id="joy"><div id="joyk"></div></div>
      <button id="abtn" aria-label="Acción">A</button>
      <div class="whint">Pisá puertas para entrar · A para hablar o entrenar</div>
    </section>
    <nav id="nav"></nav>
  </div>
  <div id="battle" class="overlay" hidden></div>
  <div id="mini" class="overlay" hidden></div>
  <div id="match" hidden></div>
  <div id="modal" hidden></div>
  <div id="toasts"></div>
  <div id="bigfx"></div>
  <noscript>Necesitás activar JavaScript para jugar.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
